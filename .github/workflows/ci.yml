name: Quality and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: bacshop_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: bacshop_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bacshop_ci -d bacshop_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bacshop_ci:isolated-ci-only@127.0.0.1:5432/bacshop_integration
      BACSHOP_INTEGRATION_DATABASE_URL: postgresql://bacshop_ci:isolated-ci-only@127.0.0.1:5432/bacshop_integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
