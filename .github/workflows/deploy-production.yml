name: Deploy Production

on:
  push:
    branches: [Production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: bacshop-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production change
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server JavaScript syntax
        run: node --check server.js && node --check app.js
      - name: Run application tests
        run: npm test
      - name: Check production dependencies
        run: npm audit --omit=dev

  deploy:
    name: Deploy Bacshop to Azure
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Build deployment package
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/bacshop-package"
          mkdir -p "$package_dir"
          git archive "$GITHUB_SHA" | tar -x -C "$package_dir"
          cp -a node_modules "$package_dir/node_modules"
          (cd "$package_dir" && zip -qr "$RUNNER_TEMP/bacshop.zip" .)
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy package to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: bacshop-pipeleres-20261007
          package: ${{ runner.temp }}/bacshop.zip
      - name: Verify live Bacshop health endpoint
        shell: bash
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error https://bacshop.id/api/health; then
              printf '\n'
              exit 0
            fi
            sleep 10
          done
          echo "Bacshop did not become healthy after deployment." >&2
          exit 1
